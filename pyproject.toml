[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arc-compiler"
version = "1.1.0"
description = "Agentic Requirement Compiler"
requires-python = ">=3.11"
dependencies = [
  "aiofiles",
  "openai",
  "requests",
  "python-dotenv",
  "pyyaml",
  "pydantic",
  "colorama",
  "jsonschema",
  "tiktoken",
  "httpx[socks]",
  "deepagents",
  "langchain-openai",
]

[project.scripts]
arc = "main:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
  "config_validator",
  "main",
]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = [
  "agents",
  "agents.*",
  "app_type_handler",
  "app_type_handler.*",
  "arcbench_agent_runtime",
  "arcbench_agent_runtime.*",
  "context",
  "context.*",
  "core",
  "core.*",
  "integrations",
  "integrations.*",
  "skills",
  "templates",
  "tools",
  "tools.*",
]

[tool.setuptools.package-data]
skills = ["**/*"]
templates = ["**/*", "**/.*"]

[tool.setuptools.exclude-package-data]
skills = ["**/__pycache__/*", "**/*.pyc"]
templates = ["**/__pycache__/*", "**/*.pyc"]

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-asyncio",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
